<!DOCTYPE html>

        <main class="flex-1 overflow-y-auto bg-slate-50 dark:bg-slate-900 p-6 lg:p-8">

                                <p class="text-xs text-slate-500 dark:text-slate-400">Due: Tomorrow, 11:59 PM</p>
                            </div>
                            <button onclick="alert('Submission portal opening...')" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow transition">
                                Submit Assignment
                            </button>
                        </div>
                    </div>

            </div>
